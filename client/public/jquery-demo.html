<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>jQuery Module 3 Demo</title><style>body{font-family:Arial;max-width:700px;margin:40px auto;padding:20px;background:#f5f7f5}section{background:white;padding:22px;margin:15px 0;border-radius:12px}input,button{padding:10px;margin:5px;border-radius:7px;border:1px solid #ccc}button{background:#176b55;color:white}#box{padding:15px;background:#e4f4ed}</style><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script></head><body><h1>jQuery Actions Demo</h1><section><h2>Selectors and .val()</h2><input id="a" type="number" placeholder="First number"><input id="b" type="number" placeholder="Second number"><button id="add">Add</button><p id="result">Result appears here.</p></section><section><h2>Manipulators and effects</h2><button id="toggle">Toggle message</button><button id="style">Change style</button><div id="box"><p class="msg">jQuery can update selected elements.</p></div></section><script>$(document).ready(function(){$("#add").click(function(){if($("#a").val()===""||$("#b").val()==="")return $("#result").text("Enter both numbers.");$("#result").text("Result: "+(Number($("#a").val())+Number($("#b").val())))});$("#toggle").click(function(){$("#box").fadeToggle(250)});$("#style").click(function(){$("#box").find(".msg").css({color:"#176b55",fontWeight:"bold"})})});</script></body></html>
